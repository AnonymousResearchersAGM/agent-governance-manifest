summary: >-
  Implemented the isolated AGM vNext development prototype while preserving
  the reported v0.1 compatibility module and research boundary. The change
  adds typed governance cases, complete multi-risk rule resolution, obligation
  compilation, evidence binding, explicit human attestation, authorized
  maintainer operations, repair and migration diagnostics, closure receipts,
  local contributor/maintainer panels, CLI workflows, portable Skills,
  steward protocols, documentation, and ten deterministic demonstration
  scenarios.
rationale: >-
  AGM v0.1 retained multiple risk observations but selected evidence only from
  the highest risk profile. vNext needs contribution-specific governance
  instantiation that preserves all matched obligations, binds evidence and
  accountability to the actual change, separates agent preparation from human
  authority, and supports independently authorized verification, repair,
  decision, and closure.
