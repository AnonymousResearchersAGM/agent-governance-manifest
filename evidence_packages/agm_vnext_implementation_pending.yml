known_limitations: >-
  This remains a local v0.2-dev prototype. It does not provide cryptographic
  identity, signed attestations, hosted storage, CI/platform enforcement, or
  proof that a claimed human identity is truthful. Change-type and semantic
  selectors are supplied extension points rather than an embedded AST parser.
  The local panels use loopback binding and per-session action tokens but are
  not a multi-user authentication service. Migration checking is diagnostic
  and never silently mutates an open case. Materiality and affected obligation
  scope are explicitly declared and remain subject to maintainer inspection.
  Browser screenshot QA of the generated file URL was blocked by the browser
  security policy; HTTP two-stage UI behavior and HTML structure are covered
  by automated tests. No usability, field-adoption, or organizational-outcome
  claim is made. Independent human review of the governance
  self-modification remains pending.
