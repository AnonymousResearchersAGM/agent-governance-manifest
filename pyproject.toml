[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-manifest"
version = "0.2.0.dev0"
description = "AGM v0.1 compatibility artifact and vNext development prototype"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
agm-vnext = "agm.vnext.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
