    - "reject_evidence"
    - "request_repair"
    - "ask_clarification"
    - "invalidate_attestation"
    - "record_policy_conflict"
  policy_steward:
    - "verify_evidence"
    - "request_repair"
    - "record_policy_conflict"
    - "resolve_policy_conflict"
  maintainer:
    - "verify_evidence"
    - "reject_evidence"
    - "request_repair"
    - "ask_clarification"
    - "invalidate_attestation"
    - "record_policy_conflict"
    - "resolve_policy_conflict"
    - "authorized_override"
    - "decide_accept"
    - "decide_reject"
    - "decide_request_changes"
    - "decide_close"
