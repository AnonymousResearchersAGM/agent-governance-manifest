schema_version: "agm.permissions/v0.2-dev"
permissions:
  system:
    - "open_case"
    - "resolve_policy"
    - "compile_obligations"
    - "mark_evidence_state"
    - "await_attestation"
    - "mark_ready"
    - "record_closure"
  contributor_agent:
    - "open_case"
    - "prepare_evidence"
    - "submit_for_verification"
    - "resubmit"
  contributor:
    - "open_case"
    - "prepare_evidence"
    - "request_correction"
    - "submit_for_verification"
    - "resubmit"
  accountable_human:
    - "confirm_attestation"
    - "decline_attestation"
    - "request_correction"
  maintainer_verifier:
