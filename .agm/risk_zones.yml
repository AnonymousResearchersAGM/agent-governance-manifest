schema_version: "agm.risk_zones/v0.1"
default_risk_level: "high"
risk_zones:
  - id: "documentation"
    risk_zone_id: "documentation"
    level: "low"
    risk_level: "low"
    patterns:
      - "README.md"
      - "docs/**"
    path_patterns:
      - "README.md"
      - "docs/**"
    description: "Documentation and explanatory material."
  - id: "task_logic"
    risk_zone_id: "task_logic"
    level: "medium"
    risk_level: "medium"
    patterns:
      - "demo_app/tasks.py"
    path_patterns:
      - "demo_app/tasks.py"
    description: "Ordinary task-tracker business logic."
  - id: "configuration"
    risk_zone_id: "configuration"
    level: "high"
    risk_level: "high"
    patterns:
      - "demo_app/config.py"
      - "requirements.txt"
      - "app/dependencies.txt"
      - ".agm/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "skills/**"
      - "tests/**"
      - "demo_app/tests/**"
    path_patterns:
      - "demo_app/config.py"
      - "requirements.txt"
      - "app/dependencies.txt"
      - ".agm/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "skills/**"
      - "tests/**"
      - "demo_app/tests/**"
    description: "Configuration, dependency, test strategy, governance policy, and governance entrypoint surfaces."
  - id: "authentication"
    risk_zone_id: "authentication"
    level: "critical"
    risk_level: "critical"
    patterns:
      - "demo_app/auth.py"
      - "**/auth.py"
    path_patterns:
      - "demo_app/auth.py"
      - "**/auth.py"
    description: "Authentication and security-sensitive authorization behavior."
