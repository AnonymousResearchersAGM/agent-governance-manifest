schema_version: "agm.autonomy_profiles/v0.2-dev"
autonomy_profiles:
  - id: "human_direct"
    description: "Direct human contribution; no claim about authorship is inferred from package absence."
    obligation_ids: []
    action_scope: "human-controlled"
    persistence: "none"
    permissions: "human account"
    supervision: "direct"
    submission_authority: "human"
    delegation: "none"
  - id: "supervised_agent"
    description: "Agent acts within a task under active human supervision."
    obligation_ids:
      - "O-AGENT-SCOPE"
    action_scope: "task-bounded"
    persistence: "session"
    permissions: "workspace"
    supervision: "active"
    submission_authority: "human"
    delegation: "declared"
  - id: "autonomous_agent"
    extends: "supervised_agent"
    description: "Agent may persist, delegate, or prepare submission with delayed supervision."
    obligation_ids:
      - "O-AGENT-SCOPE"
      - "O-HUMAN-ATTEST"
    action_scope: "project-bounded"
    persistence: "extended"
    permissions: "declared-project"
    supervision: "delayed"
    submission_authority: "prepare-only"
    delegation: "allowed-and-recorded"
