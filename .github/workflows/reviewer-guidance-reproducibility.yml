name: Reviewer Guidance and Review Briefing reproducibility

on:
  pull_request:
  push:
    branches:
      - "codex/**"

jobs:
  canonical-demo:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Check committed frozen artifacts before regeneration
        run: |
          python scripts/check_reviewer_guidance_demo_hashes.py
          python scripts/check_review_briefing_demo_hashes.py
          python scripts/check_review_interactive_demo_hashes.py
          python scripts/check_pr_diagnostic_demo_hashes.py

      - name: Generate deterministic research demos
        env:
          PYTHONPATH: src
        run: |
          python scripts/generate_reviewer_guidance_demos.py
          python scripts/generate_review_briefing_demos.py
          python scripts/generate_review_interactive_demos.py
          python scripts/generate_pr_diagnostic_demos.py

      - name: Check regenerated frozen SHA-256 values
        run: |
          python scripts/check_reviewer_guidance_demo_hashes.py
          python scripts/check_review_briefing_demo_hashes.py
          python scripts/check_review_interactive_demo_hashes.py
          python scripts/check_pr_diagnostic_demo_hashes.py

      - name: Verify Review Briefing test-file isolation
        run: python -m pytest -q tests/test_vnext_review_briefing.py

      - name: Verify Phase 1.1 test-file isolation
        run: python -m pytest -q tests/test_vnext_review_briefing_phase_1_1.py

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Validate deterministic PR diagnostic links
        run: python scripts/validate_pr_diagnostic_links.py

      - name: Scan participant-facing diagnostic terms
        run: python scripts/validate_pr_diagnostic_participant_terms.py

      - name: Confirm regeneration leaves tracked files unchanged
        run: git diff --exit-code

      - name: Package exact tracked Git blobs
        run: >-
          python scripts/package_tracked_repository.py
          --output .ci-tracked-repository.zip

      - name: Verify fresh tracked ZIP before and after regeneration
        run: >-
          python scripts/verify_tracked_repository_package.py
          .ci-tracked-repository.zip
